<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient></defs>
<rect width="960" height="444" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
<text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">LED0 in all four modes, same 4 s time scale</text>
<text x="480" y="57" text-anchor="middle" fill="#94a3b8" font-size="12">counter increments at 1, 2, 5, 10 Hz  →  LED0 blinks at 0.5, 1, 2.5, 5 Hz</text>
<rect x="20" y="76" width="920" height="352" rx="8" fill="#1e293b" opacity="0.7" stroke="#334155"/>
<text x="36" y="100" fill="#f8fafc" font-size="13" font-weight="700">LED0 = count[0]</text>
<text x="36" y="128" fill="#cbd5e1" font-size="12" font-weight="700">clk (100 MHz)</text>
<rect x="180" y="112" width="730" height="24" rx="4" fill="#334155"/>
<text x="545.0" y="128" text-anchor="middle" fill="#e2e8f0" font-size="12">400,000,000 clock edges in 4 s (too dense to draw)</text>
<line x1="180.0" y1="150" x2="180.0" y2="398" stroke="#334155" stroke-dasharray="4,4" stroke-width="1"/>
<text x="180.0" y="416" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">0 s</text>
<line x1="362.5" y1="150" x2="362.5" y2="398" stroke="#334155" stroke-dasharray="4,4" stroke-width="1"/>
<text x="362.5" y="416" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">1 s</text>
<line x1="545.0" y1="150" x2="545.0" y2="398" stroke="#334155" stroke-dasharray="4,4" stroke-width="1"/>
<text x="545.0" y="416" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">2 s</text>
<line x1="727.5" y1="150" x2="727.5" y2="398" stroke="#334155" stroke-dasharray="4,4" stroke-width="1"/>
<text x="727.5" y="416" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">3 s</text>
<line x1="910.0" y1="150" x2="910.0" y2="398" stroke="#334155" stroke-dasharray="4,4" stroke-width="1"/>
<text x="910.0" y="416" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">4 s</text>
<text x="36" y="174" fill="#38bdf8" font-size="12" font-weight="700">freq = 00</text>
<text x="36" y="188" fill="#64748b" font-size="10">clkf 1 Hz → LED0 0.5 Hz</text>
